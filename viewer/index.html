<!doctype html>
<!-- Sample viewer: renders a tree data file with the same treemap module the
     mdsite component uses. Selects switch the size and color values; the
     theme button flips the heatmap ramp between light and dark. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphly viewer</title>
<style>
  :root { --site-hs: 212deg 100%; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1.5rem auto; max-width: 720px;
         padding: 0 1rem; color-scheme: light; }
  body.dark { --site-hs: 204deg 100%; background: #111; color: #eee; color-scheme: dark; }
  header { display: flex; gap: .75rem; align-items: center; margin-bottom: 1rem; }
  h1 { font-size: 1.1rem; margin: 0 auto 0 0; }
  #treemap { position: relative; width: 100%; height: 180px; }
  select, button { font: inherit; }
</style>
</head>
<body>
<header>
  <h1 id="title">graphly</h1>
  <label>size <select id="size"></select></label>
  <label>color <select id="color"></select></label>
  <button id="theme" type="button">dark</button>
</header>
<div id="treemap"></div>
<script type="module">
  import { render_treemap } from '/component/treemap.js';

  const tree = await (await fetch('/graph.json')).json();
  const el = document.getElementById('treemap');
  const size = document.getElementById('size');
  const color = document.getElementById('color');

  // Populate the value selects from the file's declared value names
  document.getElementById('title').textContent = tree.title;
  for (const select of [size, color])
    select.append(...tree.values.map(name => new Option(name, name)));
  size.value = tree.values.includes('coverage') ? 'coverage' : tree.values[0];
  color.value = tree.values.includes('relevance') ? 'relevance' : tree.values[0];

  const draw = () => render_treemap(el, tree, {
    size: size.value, color: color.value,
    dark: document.body.classList.contains('dark'),
  });

  size.onchange = color.onchange = draw;
  document.getElementById('theme').onclick =
    () => { document.body.classList.toggle('dark'); draw(); };
  addEventListener('resize', draw);
  draw();
</script>
</body>
</html>
