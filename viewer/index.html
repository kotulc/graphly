<!doctype html>
<!-- graphly viewer: minimal single-file sigma.js explorer for one graph file.
     Settings (edge visibility, color mode) are config-driven and served by
     `graphly view` at /settings.json alongside /graph.json. -->
<html>
<head>
  <meta charset="utf-8">
  <title>graphly viewer</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #app { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; left: 12px; z-index: 1; min-width: 180px;
             max-height: 90vh; overflow-y: auto; padding: 10px 14px; font-size: 13px;
             background: #ffffffd9; border-radius: 8px; box-shadow: 0 1px 4px #0003; }
    #panel h3 { margin: 8px 0 4px; font-size: 13px; }
    #panel li { list-style: none; margin: 2px 0; }
    #panel ul { margin: 0; padding: 0; }
    .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px;
              border-radius: 5px; vertical-align: baseline; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="panel"></div>
<script src="https://unpkg.com/graphology@0.26.0/dist/graphology.umd.min.js"></script>
<script src="https://unpkg.com/graphology-library@0.8.0/dist/graphology-library.min.js"></script>
<script src="https://unpkg.com/sigma@3.0.2/dist/sigma.min.js"></script>
<script>
  const PALETTE = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#46f0f0',
                   '#f032e6', '#bcf60c', '#008080', '#9a6324', '#800000', '#808000'];

  // Assign a palette color to each unique node category, sorted for stability
  function type_colors(graph) {
    const types = [...new Set(graph.mapNodes((_, a) => a.category))].sort();
    const colors = {};
    types.forEach((type, i) => { colors[type] = PALETTE[i % PALETTE.length]; });
    return colors;
  }

  // Style every node: label from key, size by node level, color by category
  function style_nodes(graph, settings) {
    const colors = type_colors(graph);
    graph.forEachNode((node, attrs) => {
      const size = attrs.category === 'topic' ? 16
        : attrs.category === 'keyword' ? 4 + Math.min(8, graph.inDegree(node))
        : 10;
      graph.mergeNodeAttributes(node, {
        label: attrs.key,
        size,
        color: colors[attrs.category] ?? '#444444',
      });
    });
  }

  // Side panel: node categories with color swatches
  function render_panel(graph, settings) {
    const colors = type_colors(graph);
    const types = [...new Set(graph.mapNodes((_, a) => a.category))].sort();
    document.getElementById('panel').innerHTML =
      `<h3>Categories</h3><ul>${types.map(t =>
        `<li><span class="swatch" style="background:${colors[t]}"></span>${t}</li>`
      ).join('')}</ul>`;
  }

  async function main() {
    const [graph_data, settings] = await Promise.all([
      fetch('/graph.json').then(response => response.json()),
      fetch('/settings.json').then(response => response.json()),
    ]);
    const graph = graphology.Graph.from(graph_data);

    style_nodes(graph, settings);
    render_panel(graph, settings);
    if (!settings.show_edges)
      graph.forEachEdge(edge => graph.setEdgeAttribute(edge, 'hidden', true));

    // Spread nodes with a circular seed plus a short force-directed refinement
    graphologyLibrary.layout.circular.assign(graph);
    graphologyLibrary.layoutForceAtlas2.assign(graph, {
      iterations: 200,
      settings: graphologyLibrary.layoutForceAtlas2.inferSettings(graph),
    });

    new Sigma(graph, document.getElementById('app'), { defaultEdgeColor: '#ccc' });
  }

  main();
</script>
</body>
</html>
